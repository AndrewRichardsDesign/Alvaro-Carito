name: Deploy to GitHub Pages

on:
  push:
    # `main` is production. The old working branch is here only because the
    # github-pages *environment* still restricts deployments to it — a separate
    # setting from the Pages source, and one that switching the source does not
    # always rewrite. Clear it under Settings -> Environments -> github-pages ->
    # "Deployment branches and tags", then drop the second entry here: while
    # both deploy, whichever push lands last is what the live site shows.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue Pages deploys rather than cancelling them. An admin "Save to GitHub"
# lands as a push, and with cancel-in-progress a second save would cancel the
# deploy of the first — which looks like a failure even though the content
# reached the repository fine.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Admin saves commit back to whichever branch this site was built
          # from, rather than guessing at `main`.
          VITE_DEPLOY_BRANCH: ${{ github.ref_name }}
      # `configure-pages` only *enables* Pages; it will not convert a site that
      # is already set to "deploy from a branch". This does, and it is the whole
      # ball game: while the branch source is on, GitHub's legacy builder
      # republishes the unbuilt repository root over every deploy, and the
      # github-pages environment stays locked to that one branch, so deploying
      # from main is rejected before it starts.
      - name: Make Pages build from this workflow, not from a branch
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> $code"
          cat /tmp/pages.json || true
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Pages now builds from this workflow."
          else
            echo "::warning::Could not switch the Pages source automatically (HTTP $code). Set Settings -> Pages -> Source to GitHub Actions by hand."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it has never been enabled. It does NOT change an
          # existing "deploy from a branch" setting — that has to be switched
          # by hand in Settings → Pages → Source → GitHub Actions. Until it is,
          # the legacy builder also runs on every push and, being slower,
          # overwrites this deploy with the unbuilt repository root.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
