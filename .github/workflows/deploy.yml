name: Deploy to GitHub Pages

on:
  push:
    # `main` only. Work happens on branches and reaches the live site by being
    # merged — if a working branch deployed too, pushing to it would quietly
    # overwrite production, and admin saves would land on whichever branch
    # deployed last.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue Pages deploys rather than cancelling them. An admin "Save to GitHub"
# lands as a push, and with cancel-in-progress a second save would cancel the
# deploy of the first — which looks like a failure even though the content
# reached the repository fine.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Admin saves commit back to whichever branch this site was built
          # from, rather than guessing at `main`.
          VITE_DEPLOY_BRANCH: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it has never been enabled. It does NOT change an
          # existing "deploy from a branch" setting — that has to be switched
          # by hand in Settings → Pages → Source → GitHub Actions. Until it is,
          # the legacy builder also runs on every push and, being slower,
          # overwrites this deploy with the unbuilt repository root.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
